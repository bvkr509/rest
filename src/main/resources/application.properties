spring.application.name=rest

server.port=8089

spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

app.security.user.username=user
app.security.user.password=user123
app.security.admin.username=admin
app.security.admin.password=admin123


# JWT secret (HMAC) - keep long
app.jwt.secret=change-this-to-a-very-long-secret-key-32chars-minimum!!
app.jwt.issuer=telstra-rest
app.jwt.expiry-seconds=3600
# For real production, store secrets in env vars/K8s Secrets, not in file.


management.endpoints.web.exposure.include=health,info,metrics,mappings
management.endpoint.health.show-details=always

